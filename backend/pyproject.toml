[tool.poetry]
name = "siem-backend"
version = "0.1.0"
description = "Enterprise Security Information and Event Management Backend"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.95.1"
uvicorn = "^0.22.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
pydantic = "^1.10.7"
sqlalchemy = "^2.0.12"
elasticsearch = "*"
redis = "*"
kafka-python = "*"
aiohttp = "^3.8.4"
asyncio = "^3.4.3"
python-dotenv = "^1.0.0"
requests = "^2.30.0"
cryptography = "^41.0.1"
pyOpenSSL = "*"
certifi = "*"

[tool.poetry.dev-dependencies]
pytest = "^7.3.1"
mypy = "^1.3.0"
black = "^23.3.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
